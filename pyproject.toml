[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ibibio-tts"
version = "0.1.0"
description = "Ibibio Common Voice TTS research data pipeline"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "MIT"
dependencies = [
  "av>=14.0",
  "numpy>=2.0",
  "pandas>=2.2",
  "pyarrow>=19.0",
  "pyyaml>=6.0",
]

[dependency-groups]
dev = [
  "mypy>=1.15",
  "pandas-stubs>=2.2",
  "pytest>=8.3",
  "ruff>=0.11",
  "types-pyyaml>=6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ibibio_tts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["ibibio_tts"]
